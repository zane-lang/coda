name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.0.1 or v3.0.1)"
        required: true
        type: string
      retry_existing_tag:
        description: "Retry publishing an existing tag without changing it"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

# Serialize releases, including manual dispatches and manually pushed tags.
concurrency:
  group: coda-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Run manual releases from main."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate version and prepare metadata
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_RETRY: ${{ inputs.retry_existing_tag }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if [ "$RELEASE_RETRY" = "true" ]; then
              tag="v${RELEASE_VERSION#v}"
              git checkout --detach "refs/tags/$tag"
              tag=$(python3 scripts/release.py --check "$tag")
            else
              tag=$(python3 scripts/release.py "$RELEASE_VERSION")
              if git show-ref --verify --quiet "refs/tags/$tag"; then
                echo "::error::Tag $tag already exists. Enable retry_existing_tag to retry publishing."
                exit 1
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add pyproject.toml
              if ! git diff --cached --quiet; then
                git commit -m "Release $tag"
              fi
              git tag -a "$tag" -m "Release $tag"
            fi
          else
            tag=$(python3 scripts/release.py --check "$RELEASE_TAG")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install devbox + packages
        if: github.event_name == 'workflow_dispatch'
        uses: jetify-com/devbox-install-action@v0.15.0

      - name: Test before pushing the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          for suite in test-cpp test-c-ffi test-py-ffi test-ocaml test-crystal; do
            devbox run -- just "$suite"
          done

      - name: Push version commit and tag together
        if: github.event_name == 'workflow_dispatch' && !inputs.retry_existing_tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        # The built-in token does not trigger tag-push workflows. The dependent
        # jobs below publish this exact commit in the same workflow run.
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

  # ── Build all platform wheels in one go ───────────────────────────────────────
  build-wheels:
    name: Build wheels
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install devbox + packages
        uses: jetify-com/devbox-install-action@v0.15.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cross-compile all FFI libraries
        run: devbox run -- just cross-all

      - name: Install wheel build tools in Devbox
        run: devbox run -- python3 -m pip install build wheel

      - name: Build platform wheels
        run: |
          declare -A WHEEL_PLAT=(
            [x86_64-linux-gnu]=manylinux_2_17_x86_64
            [x86_64-linux-musl]=musllinux_1_2_x86_64
            [aarch64-linux-gnu]=manylinux_2_17_aarch64
            [aarch64-linux-musl]=musllinux_1_2_aarch64
            [x86_64-windows-gnu]=win_amd64
            [aarch64-windows-gnu]=win_arm64
          )
          declare -A LIB_FILE=(
            [x86_64-linux-gnu]=libcoda_ffi.so
            [x86_64-linux-musl]=libcoda_ffi.so
            [aarch64-linux-gnu]=libcoda_ffi.so
            [aarch64-linux-musl]=libcoda_ffi.so
            [x86_64-windows-gnu]=libcoda_ffi.dll
            [aarch64-windows-gnu]=libcoda_ffi.dll
          )
          mkdir -p wheelhouse
          for target in "${!WHEEL_PLAT[@]}"; do
            plat="${WHEEL_PLAT[$target]}"
            lib="${LIB_FILE[$target]}"
            tmpdir=$(mktemp -d)
            # Separate source trees prevent setuptools from reusing another
            # platform's cached native library in build/lib/coda.
            mkdir -p "$tmpdir/source/bindings"
            cp pyproject.toml README.md "$tmpdir/source/"
            cp -R bindings/python "$tmpdir/source/bindings/"
            cp "dist/${target}/${lib}" "$tmpdir/source/bindings/python/"
            devbox run -- python3 -m build "$tmpdir/source" --wheel --outdir "$tmpdir/wheels/"
            devbox run -- python3 -m wheel tags --platform-tag "${plat}" --remove "$tmpdir/wheels"/*.whl
            mv "$tmpdir/wheels"/*.whl "$GITHUB_WORKSPACE/wheelhouse/"
          done

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Upload raw library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: |
            dist/**/*.so
            dist/**/*.a
            dist/**/*.dll
            dist/**/*.lib

  # ── Publish to PyPI and create a GitHub Release ───────────────────────────────
  publish:
    name: Publish
    needs: [prepare, build-wheels]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Download raw libraries
        uses: actions/download-artifact@v4
        with:
          name: libs
          path: libs/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p release_assets
          cp dist/*.whl release_assets/
          for target_dir in libs/*/; do
            target=$(basename "$target_dir")
            for f in "$target_dir"*; do
              [ -f "$f" ] || continue
              filename=$(basename "$f")
              ext="${filename##*.}"
              base="${filename%.*}"
              cp "$f" "release_assets/${base}-${target}.${ext}"
            done
          done
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            release_assets/*
