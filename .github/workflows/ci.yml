name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install devbox + packages
        uses: jetify-com/devbox-install-action@v0.15.0

      - name: Test C++ API
        run: devbox run -- just test-cpp

      - name: Test C FFI
        run: devbox run -- just test-c-ffi

      - name: Test Python binding
        run: devbox run -- just test-py-ffi

      - name: Test OCaml binding
        run: devbox run -- just test-ocaml
