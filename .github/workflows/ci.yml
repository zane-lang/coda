name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install devbox + packages
        uses: jetify-com/devbox-install-action@v0.15.0

      - name: Test C++ API
        shell: bash
        run: |
          devbox run -- just test-cpp > /tmp/cpp.log 2>&1 || {
            cat /tmp/cpp.log
            exit 1
          }

      - name: Test C FFI
        shell: bash
        run: |
          devbox run -- just test-c-ffi > /tmp/c-ffi.log 2>&1 || {
            cat /tmp/c-ffi.log
            exit 1
          }

      - name: Test Python binding
        shell: bash
        run: |
          devbox run -- just test-py-ffi > /tmp/python.log 2>&1 || {
            cat /tmp/python.log
            exit 1
          }

      - name: Test OCaml binding
        shell: bash
        run: |
          devbox run -- just test-ocaml > /tmp/ocaml.log 2>&1 || {
            cat /tmp/ocaml.log
            exit 1
          }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: /tmp/*.log
          if-no-files-found: ignore
